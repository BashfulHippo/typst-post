[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typst-post"
version = "0.1.0"
description = "Post-compilation utilities for Typst: booklet imposition, page rotation, reordering, and project packing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pypdf>=4.0"]
keywords = ["typst", "pdf", "booklet", "imposition", "print"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Repository = "https://github.com/BashfulHippo/typst-post"
Issues = "https://github.com/BashfulHippo/typst-post/issues"

[project.scripts]
typst-post = "typst_post.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/typst_post"]
